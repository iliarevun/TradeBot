<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TradeBot · Аналіз ринків</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* ── Reset & Base ──────────────────────────────────────── */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0e1a; --bg2:#111827; --bg3:#1a2235; --bg4:#1e2d45;
    --accent:#3b82f6; --accent2:#2563eb; --green:#22c55e; --red:#ef4444;
    --yellow:#f59e0b; --purple:#8b5cf6; --orange:#f97316;
    --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b;
    --border:#1e3a5f; --card:#111827;
    --radius:12px; --radius-sm:8px;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}

  /* ── Layout ────────────────────────────────────────────── */
  #app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  #header{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px}
  #content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 80px}
  #navbar{position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100}

  /* ── Header ─────────────────────────────────────────────── */
  #header{display:flex;align-items:center;justify-content:space-between}
  .header-left{display:flex;align-items:center;gap:10px}
  .logo{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .header-title{font-size:15px;font-weight:700;color:var(--text)}
  .header-sub{font-size:11px;color:var(--text3)}
  .live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.2)}}

  /* ── Nav ────────────────────────────────────────────────── */
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;cursor:pointer;border-radius:var(--radius-sm);transition:.2s;color:var(--text3);border:none;background:none;flex:1}
  .nav-btn.active{color:var(--accent)}
  .nav-btn svg{width:20px;height:20px}
  .nav-btn span{font-size:10px;font-weight:500}

  /* ── Cards ──────────────────────────────────────────────── */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .card-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
  .section-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px}

  /* ── Pair selector ──────────────────────────────────────── */
  .cat-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .cat-tabs::-webkit-scrollbar{display:none}
  .cat-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.2s}
  .cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .pairs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pair-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;cursor:pointer;transition:.2s;text-align:left}
  .pair-btn:active,.pair-btn.active{border-color:var(--accent);background:var(--bg4)}
  .pair-name{font-size:13px;font-weight:600;color:var(--text)}
  .pair-price{font-size:11px;color:var(--text3);margin-top:2px}
  .pair-change{font-size:11px;margin-top:1px}
  .pair-change.up{color:var(--green)} .pair-change.down{color:var(--red)}

  /* ── TF selector ─────────────────────────────────────────── */
  .tf-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tf-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
  .tf-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ── Chart ───────────────────────────────────────────────── */
  #chartContainer{width:100%;height:260px;border-radius:var(--radius);overflow:hidden;position:relative;background:var(--bg2)}
  #chart{width:100%;height:100%}
  .chart-overlay{position:absolute;top:10px;left:10px;z-index:10;display:flex;gap:6px;flex-wrap:wrap}
  .indicator-badge{background:rgba(0,0,0,.6);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px;font-weight:500}

  /* ── Signal card ─────────────────────────────────────────── */
  .signal-main{display:flex;align-items:center;gap:14px;padding:14px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px}
  .signal-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .signal-icon.buy{background:rgba(34,197,94,.15);border:2px solid var(--green)}
  .signal-icon.sell{background:rgba(239,68,68,.15);border:2px solid var(--red)}
  .signal-icon.neutral{background:rgba(100,116,139,.15);border:2px solid var(--text3)}
  .signal-direction{font-size:22px;font-weight:800}
  .signal-direction.buy{color:var(--green)} .signal-direction.sell{color:var(--red)} .signal-direction.neutral{color:var(--text3)}
  .signal-sub{font-size:12px;color:var(--text3);margin-top:2px}
  .signal-conf{font-size:13px;font-weight:600;margin-top:4px}

  /* ── Progress bar ────────────────────────────────────────── */
  .prog-wrap{background:var(--bg3);border-radius:4px;height:6px;overflow:hidden;margin-top:6px}
  .prog-fill{height:100%;border-radius:4px;transition:width .6s ease}
  .prog-fill.buy{background:linear-gradient(90deg,var(--green),#16a34a)}
  .prog-fill.sell{background:linear-gradient(90deg,var(--red),#dc2626)}
  .prog-fill.neutral{background:var(--text3)}

  /* ── Levels grid ─────────────────────────────────────────── */
  .levels-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .level-item{background:var(--bg3);border-radius:var(--radius-sm);padding:10px}
  .level-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .level-value{font-size:14px;font-weight:700;font-family:'Courier New',monospace}
  .level-value.green{color:var(--green)} .level-value.red{color:var(--red)} .level-value.accent{color:var(--accent)} .level-value.yellow{color:var(--yellow)}

  /* ── Strategies ──────────────────────────────────────────── */
  .strat-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .strat-item:last-child{border-bottom:none}
  .strat-rank{width:22px;height:22px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .strat-info{flex:1;min-width:0}
  .strat-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strat-dir{font-size:10px;margin-top:1px}
  .strat-dir.buy{color:var(--green)} .strat-dir.sell{color:var(--red)} .strat-dir.neutral{color:var(--text3)}
  .strat-score{font-size:13px;font-weight:700;min-width:36px;text-align:right}
  .mini-bar-wrap{width:60px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
  .mini-bar-fill{height:100%;border-radius:2px}
  .mini-bar-fill.buy{background:var(--green)} .mini-bar-fill.sell{background:var(--red)} .mini-bar-fill.neutral{background:var(--text3)}

  /* ── Indicators ──────────────────────────────────────────── */
  .ind-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .ind-row:last-child{border-bottom:none}
  .ind-name{font-size:12px;color:var(--text2)}
  .ind-value{font-size:12px;font-weight:600}
  .ind-badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .badge-bull{background:rgba(34,197,94,.15);color:var(--green)}
  .badge-bear{background:rgba(239,68,68,.15);color:var(--red)}
  .badge-neut{background:rgba(100,116,139,.15);color:var(--text3)}

  /* ── Patterns ────────────────────────────────────────────── */
  .patterns-wrap{display:flex;flex-wrap:wrap;gap:6px}
  .pat-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid}
  .pat-chip.bull{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--green)}
  .pat-chip.bear{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--red)}
  .pat-chip.neut{background:rgba(100,116,139,.1);border-color:rgba(100,116,139,.3);color:var(--text3)}

  /* ── Scan ────────────────────────────────────────────────── */
  .scan-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:.2s}
  .scan-item:active{border-color:var(--accent)}
  .scan-signal{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
  .scan-signal.buy{background:rgba(34,197,94,.15);color:var(--green)}
  .scan-signal.sell{background:rgba(239,68,68,.15);color:var(--red)}
  .scan-signal.neutral{background:rgba(100,116,139,.15);color:var(--text3)}
  .scan-name{font-size:13px;font-weight:600}
  .scan-detail{font-size:11px;color:var(--text3);margin-top:2px}
  .scan-conf{font-size:12px;font-weight:700;margin-left:auto}
  .scan-conf.buy{color:var(--green)} .scan-conf.sell{color:var(--red)} .scan-conf.neutral{color:var(--text3)}

  /* ── Journal ─────────────────────────────────────────────── */
  .journal-form{display:flex;flex-direction:column;gap:10px}
  .form-group{display:flex;flex-direction:column;gap:4px}
  .form-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;-webkit-appearance:none}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
  .form-textarea{resize:none;height:70px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--purple));border:none;border-radius:var(--radius-sm);color:#fff;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:.2s}
  .btn-primary:active{opacity:.85;transform:scale(.98)}
  .btn-secondary{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .btn-secondary:active{border-color:var(--accent)}

  /* ── Journal entries ─────────────────────────────────────── */
  .entry-item{background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border);padding:12px;margin-bottom:8px}
  .entry-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .entry-pair{font-size:13px;font-weight:700}
  .entry-result{font-size:13px;font-weight:700}
  .entry-result.win{color:var(--green)} .entry-result.loss{color:var(--red)}
  .entry-details{font-size:11px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap}
  .entry-note{font-size:12px;color:var(--text2);margin-top:6px;font-style:italic}

  /* ── Stats ───────────────────────────────────────────────── */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .stat-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
  .stat-value{font-size:20px;font-weight:800;margin-bottom:2px}
  .stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

  /* ── Risk calc ───────────────────────────────────────────── */
  .calc-result{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(139,92,246,.1));border:1px solid rgba(59,130,246,.3);border-radius:var(--radius);padding:14px;margin-top:10px}
  .calc-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
  .calc-label{font-size:12px;color:var(--text2)}
  .calc-val{font-size:13px;font-weight:700;color:var(--accent)}

  /* ── Loader ──────────────────────────────────────────────── */
  .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:12px}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-text{font-size:12px;color:var(--text3)}

  /* ── Toast ───────────────────────────────────────────────── */
  #toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 18px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}

  /* ── Empty ───────────────────────────────────────────────── */
  .empty{text-align:center;padding:40px 20px;color:var(--text3)}
  .empty-icon{font-size:36px;margin-bottom:10px}
  .empty-text{font-size:13px}

  /* ── Scrollbar ───────────────────────────────────────────── */
  ::-webkit-scrollbar{width:3px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

  /* ── Utility ─────────────────────────────────────────────── */
  .hidden{display:none!important}
  .flex{display:flex} .gap-8{gap:8px} .mt-8{margin-top:8px} .mb-4{margin-bottom:4px}
  .text-green{color:var(--green)} .text-red{color:var(--red)} .text-yellow{color:var(--yellow)} .text-accent{color:var(--accent)} .text-muted{color:var(--text3)}
  .bold{font-weight:700} .small{font-size:11px}
  .divider{border:none;border-top:1px solid var(--border);margin:10px 0}
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div class="header-left">
      <div class="logo">📈</div>
      <div>
        <div class="header-title">TradeBot</div>
        <div class="header-sub" id="headerSub">Аналіз ринків</div>
      </div>
    </div>
    <div class="live-dot" title="Live"></div>
  </div>

  <!-- Content -->
  <div id="content">

    <!-- PAGE: Аналіз -->
    <div id="page-analysis">
      <!-- Category tabs -->
      <div class="cat-tabs">
        <button class="cat-tab active" onclick="setCategory('forex')">💱 Forex</button>
        <button class="cat-tab" onclick="setCategory('crypto')">₿ Крипто</button>
        <button class="cat-tab" onclick="setCategory('indices')">📊 Індекси</button>
        <button class="cat-tab" onclick="setCategory('commodities')">🥇 Товари</button>
      </div>

      <!-- Pairs -->
      <div class="pairs-grid" id="pairsGrid"></div>

      <!-- TF -->
      <div class="tf-row mt-8" id="tfRow">
        <button class="tf-btn" onclick="setTF('5m')">M5</button>
        <button class="tf-btn" onclick="setTF('15m')">M15</button>
        <button class="tf-btn" onclick="setTF('30m')">M30</button>
        <button class="tf-btn active" onclick="setTF('1h')">H1</button>
        <button class="tf-btn" onclick="setTF('4h')">H4</button>
        <button class="tf-btn" onclick="setTF('1d')">D1</button>
      </div>

      <!-- Chart -->
      <div class="card" style="padding:0;overflow:hidden">
        <div id="chartContainer">
          <div id="chart"></div>
          <div class="chart-overlay" id="chartOverlay"></div>
        </div>
      </div>

      <!-- Analyze button -->
      <button class="btn-primary mt-8" id="analyzeBtn" onclick="runAnalysis()">
        🔍 Аналізувати
      </button>

      <!-- Results -->
      <div id="analysisResults"></div>
    </div>

    <!-- PAGE: Скан -->
    <div id="page-scan" class="hidden">
      <div class="section-title">🔍 Авто-скан ринку</div>
      <div class="cat-tabs">
        <button class="cat-tab active" onclick="setScanCat('forex')">💱 Forex</button>
        <button class="cat-tab" onclick="setScanCat('crypto')">₿ Крипто</button>
        <button class="cat-tab" onclick="setScanCat('all')">🌐 Всі</button>
      </div>
      <button class="btn-primary mb-4" onclick="runScan()">🚀 Запустити скан</button>
      <div id="scanResults"></div>
    </div>

    <!-- PAGE: Калькулятор -->
    <div id="page-calc" class="hidden">
      <div class="section-title">📐 Калькулятор ризику</div>
      <div class="card">
        <div class="journal-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Депозит ($)</label>
              <input class="form-input" id="calcDeposit" type="number" value="50" min="1" oninput="calcRisk()">
            </div>
            <div class="form-group">
              <label class="form-label">Ризик (%)</label>
              <input class="form-input" id="calcRisk" type="number" value="2" min="0.1" max="10" step="0.1" oninput="calcRisk()">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Ціна входу</label>
              <input class="form-input" id="calcEntry" type="number" step="0.00001" placeholder="1.09500" oninput="calcRisk()">
            </div>
            <div class="form-group">
              <label class="form-label">Stop Loss</label>
              <input class="form-input" id="calcSL" type="number" step="0.00001" placeholder="1.09200" oninput="calcRisk()">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Take Profit</label>
              <input class="form-input" id="calcTP" type="number" step="0.00001" placeholder="1.10100" oninput="calcRisk()">
            </div>
            <div class="form-group">
              <label class="form-label">Вартість пункту ($)</label>
              <input class="form-input" id="calcPipVal" type="number" value="0.1" step="0.01" oninput="calcRisk()">
            </div>
          </div>
        </div>
        <div class="calc-result" id="calcResult">
          <div class="calc-row"><span class="calc-label">💰 Ризик у $</span><span class="calc-val" id="rRisk">—</span></div>
          <div class="calc-row"><span class="calc-label">📦 Розмір лоту</span><span class="calc-val" id="rLot">—</span></div>
          <div class="calc-row"><span class="calc-label">🛑 SL (пунктів)</span><span class="calc-val" id="rSLPips">—</span></div>
          <div class="calc-row"><span class="calc-label">🎯 TP (пунктів)</span><span class="calc-val" id="rTPPips">—</span></div>
          <div class="calc-row"><span class="calc-label">⚖️ Risk:Reward</span><span class="calc-val" id="rRR">—</span></div>
          <div class="calc-row"><span class="calc-label">💵 Потенційний прибуток</span><span class="calc-val text-green" id="rProfit">—</span></div>
          <div class="calc-row"><span class="calc-label">⚠️ Макс. збиток/день (5%)</span><span class="calc-val text-red" id="rMaxLoss">—</span></div>
        </div>
      </div>

      <div class="card mt-8">
        <div class="card-title mb-4">📋 Таблиця ризику</div>
        <div id="riskTable"></div>
      </div>
    </div>

    <!-- PAGE: Журнал -->
    <div id="page-journal" class="hidden">
      <div class="section-title">📓 Торговий журнал</div>

      <!-- Stats -->
      <div class="stats-grid" id="journalStats">
        <div class="stat-card"><div class="stat-value text-green" id="statWR">0%</div><div class="stat-label">Win Rate</div></div>
        <div class="stat-card"><div class="stat-value text-accent" id="statTrades">0</div><div class="stat-label">Угод</div></div>
        <div class="stat-card"><div class="stat-value" id="statPL">$0</div><div class="stat-label">P&L</div></div>
        <div class="stat-card"><div class="stat-value text-yellow" id="statAvgRR">0</div><div class="stat-label">Сер. RR</div></div>
      </div>

      <!-- Add form -->
      <div class="card">
        <div class="card-title mb-4">➕ Додати угоду</div>
        <div class="journal-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Пара</label>
              <input class="form-input" id="jPair" placeholder="EUR/USD">
            </div>
            <div class="form-group">
              <label class="form-label">Напрямок</label>
              <select class="form-select" id="jDir">
                <option value="BUY">🟢 BUY (Лонг)</option>
                <option value="SELL">🔴 SELL (Шорт)</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Результат ($)</label>

async function fetchOHLCV(sym, tf, outputsize=100) {
  const cacheKey = `${sym}_${tf}`;
  const ttl = ['5m','15m','30m'].includes(tf) ? 300000 : 1800000;
  const cached = state.ohlcvCache[cacheKey];
  if(cached && Date.now() - cached.ts < ttl) return cached.data;

  const tdSym = TD_SYMBOL[sym] || sym;
  const interval = TD_TF[tf] || '1h';
  const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(tdSym)}&interval=${interval}&outputsize=${outputsize}&apikey=${TWELVE_DATA_KEY}&format=JSON`;

  const resp = await fetch(url);
  const json = await resp.json();
  if(!json.values || json.status==='error') throw new Error(json.message || 'API error');

  const candles = json.values.reverse().map(v => ({
    time: Math.floor(new Date(v.datetime).getTime()/1000),
    open: +v.open, high: +v.high, low: +v.low, close: +v.close,
    volume: +(v.volume||0),
  }));

  state.ohlcvCache[cacheKey] = {data: candles, ts: Date.now()};
  return candles;
}

// ════════════════════════════════════════════════════════════════════
//  ТЕХНІЧНИЙ АНАЛІЗ — той самий алгоритм що в Python analyzer.py
// ════════════════════════════════════════════════════════════════════

// ── Indicators ───────────────────────────────────────────────────────

function calcEMA(values, period) {
  const k = 2/(period+1);
  const result = [];
  let ema = values[0];
  for(const v of values){ ema = v*k + ema*(1-k); result.push(ema); }
  return result;
}

function calcRSI(closes, period=14) {
  const result = new Array(closes.length).fill(50);
  if(closes.length < period+1) return result;
  let avgG=0, avgL=0;
  for(let i=1;i<=period;i++){
    const d=closes[i]-closes[i-1];
    if(d>0) avgG+=d; else avgL-=d;
  }
  avgG/=period; avgL/=period;
  result[period] = avgL===0?100 : 100-(100/(1+avgG/avgL));
  for(let i=period+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    const g=d>0?d:0, l=d<0?-d:0;
    avgG=(avgG*(period-1)+g)/period;
    avgL=(avgL*(period-1)+l)/period;
    result[i]=avgL===0?100:100-(100/(1+avgG/avgL));
  }
  return result;
}

function calcATR(candles, period=14) {
  const result = new Array(candles.length).fill(0);
  for(let i=1;i<candles.length;i++){
    const hl=candles[i].high-candles[i].low;
    const hc=Math.abs(candles[i].high-candles[i-1].close);
    const lc=Math.abs(candles[i].low-candles[i-1].close);
    result[i]=Math.max(hl,hc,lc);
  }
  const atr=[...result];
  for(let i=period;i<candles.length;i++){
    let sum=0;
    for(let j=i-period+1;j<=i;j++) sum+=result[j];
    atr[i]=sum/period;
  }
  return atr;
}

function calcMACD(closes) {
  const fast=calcEMA(closes,12), slow=calcEMA(closes,26);
  const macd=fast.map((v,i)=>v-slow[i]);
  const signal=calcEMA(macd,9);
  return {macd, signal, hist:macd.map((v,i)=>v-signal[i])};
}

function calcADX(candles, period=14) {
  const n=candles.length;
  const plusDM=[], minusDM=[], tr=[];
  for(let i=1;i<n;i++){
    const up=candles[i].high-candles[i-1].high;
    const dn=candles[i-1].low-candles[i].low;
    plusDM.push((up>dn&&up>0)?up:0);
    minusDM.push((dn>up&&dn>0)?dn:0);
    tr.push(Math.max(
      candles[i].high-candles[i].low,
      Math.abs(candles[i].high-candles[i-1].close),
      Math.abs(candles[i].low-candles[i-1].close)
    ));
  }
  const smoothTR=calcEMA(tr,period);
  const smoothP=calcEMA(plusDM,period);
  const smoothM=calcEMA(minusDM,period);
  const lastTR=smoothTR[smoothTR.length-1]||1;
  const pDI=100*smoothP[smoothP.length-1]/lastTR;
  const mDI=100*smoothM[smoothM.length-1]/lastTR;
  const dxArr=[];
  for(let i=0;i<smoothTR.length;i++){
    const t=smoothTR[i]||1;
    const p=100*smoothP[i]/t, m=100*smoothM[i]/t;
    dxArr.push(Math.abs(p-m)/(p+m||1)*100);
  }
  const adx=calcEMA(dxArr,period);
  const lastADX=adx[adx.length-1]||0;
  return {adx:lastADX, plusDI:pDI, minusDI:mDI, strong:lastADX>=25};
}

// ── Support / Resistance ──────────────────────────────────────────────

function findLevels(candles, window=8) {
  const highs=candles.map(c=>c.high), lows=candles.map(c=>c.low);
  const close=candles[candles.length-1].close;
  const supports=[], resistances=[];

  for(let i=window;i<candles.length-window;i++){
    const maxH=Math.max(...highs.slice(i-window,i+window+1));
    const minL=Math.min(...lows.slice(i-window,i+window+1));
    if(highs[i]===maxH) resistances.push(highs[i]);
    if(lows[i]===minL) supports.push(lows[i]);
  }

  function cluster(arr, tol=0.0015){
    if(!arr.length) return [];
    arr.sort((a,b)=>a-b);
    const result=[{price:arr[0],count:1}];
    for(const v of arr.slice(1)){
      if((v-result[result.length-1].price)/result[result.length-1].price>tol)
        result.push({price:v,count:1});
      else { result[result.length-1].price=(result[result.length-1].price+v)/2; result[result.length-1].count++; }
    }
    return result;
  }

  const sup=cluster(supports), res=cluster(resistances);
  const ns=sup.filter(s=>s.price<close).sort((a,b)=>b.price-a.price)[0];
  const nr=res.filter(r=>r.price>close).sort((a,b)=>a.price-b.price)[0];

  // Fibonacci
  const fib={};
  if(ns&&nr){
    const diff=nr.price-ns.price;
    for(const [r,lbl] of [[0.236,'23.6%'],[0.382,'38.2%'],[0.500,'50.0%'],[0.618,'61.8%'],[0.786,'78.6%']])
      fib[lbl]=ns.price+diff*r;
  }

  return {
    nearest_support: ns?.price||null,
    nearest_resistance: nr?.price||null,
    support_strength: ns?.count||0,
    resistance_strength: nr?.count||0,
    fib_levels: fib,
  };
}

// ── Candlestick Patterns (порт з Python) ──────────────────────────────

function detectPatterns(candles) {
  const found=[];
  if(candles.length<3) return found;
  const n=candles.length-1;
  const c=candles;

  function body(i){return Math.abs(c[i].close-c[i].open);}
  function rng(i){return c[i].high-c[i].low;}
  function upper(i){return c[i].high-Math.max(c[i].open,c[i].close);}
  function lower(i){return Math.min(c[i].open,c[i].close)-c[i].low;}
  function bull(i){return c[i].close>c[i].open;}
  function bear(i){return c[i].close<c[i].open;}

  if(rng(n)<1e-10) return found;

  // Pin bar
  if(lower(n)>=0.6*rng(n)&&body(n)<=0.35*rng(n)) found.push('bullish_pinbar');
  if(upper(n)>=0.6*rng(n)&&body(n)<=0.35*rng(n)) found.push('bearish_pinbar');

  // Hammer / Shooting Star
  if(body(n)>0&&lower(n)>=2*body(n)&&upper(n)<=0.15*rng(n)) found.push('hammer');
  if(body(n)>0&&upper(n)>=2*body(n)&&lower(n)<=0.15*rng(n)) found.push('shooting_star');

  // Engulfing
  if(n>=1&&bear(n-1)&&bull(n)&&c[n].open<=c[n-1].close&&c[n].close>=c[n-1].open&&body(n)>body(n-1)*1.05)
    found.push('bullish_engulfing');
  if(n>=1&&bull(n-1)&&bear(n)&&c[n].open>=c[n-1].close&&c[n].close<=c[n-1].open&&body(n)>body(n-1)*1.05)
    found.push('bearish_engulfing');

  // Doji
  if(body(n)<=0.07*rng(n)) found.push('doji');

  // Inside Bar
  if(n>=1&&c[n].high<=c[n-1].high&&c[n].low>=c[n-1].low) found.push('inside_bar');

  // Morning/Evening Star
  if(n>=2&&bear(n-2)&&body(n-2)>0.5*rng(n-2)&&body(n-1)<0.3*rng(n-1)&&bull(n)&&c[n].close>(c[n-2].open+c[n-2].close)/2)
    found.push('morning_star');
  if(n>=2&&bull(n-2)&&body(n-2)>0.5*rng(n-2)&&body(n-1)<0.3*rng(n-1)&&bear(n)&&c[n].close<(c[n-2].open+c[n-2].close)/2)
    found.push('evening_star');

  // 3 White Soldiers / 3 Black Crows
  if(n>=2&&[0,1,2].every(i=>bull(n-i))&&c[n].close>c[n-1].close&&c[n-1].close>c[n-2].close)
    found.push('three_white');
  if(n>=2&&[0,1,2].every(i=>bear(n-i))&&c[n].close<c[n-1].close&&c[n-1].close<c[n-2].close)
    found.push('three_black');

  // Tweezers
  if(n>=1&&bear(n-1)&&bull(n)&&Math.abs(c[n].low-c[n-1].low)/Math.max(rng(n),1e-10)<0.05)
    found.push('tweezer_bottom');
  if(n>=1&&bull(n-1)&&bear(n)&&Math.abs(c[n].high-c[n-1].high)/Math.max(rng(n),1e-10)<0.05)
    found.push('tweezer_top');

  return found;
}

// ── Trend Detection ───────────────────────────────────────────────────

function detectTrend(candles) {
  const closes=candles.map(c=>c.close);
  const e21=calcEMA(closes,21), e50=calcEMA(closes,50), e200=calcEMA(closes,200);
  const lc=closes[closes.length-1];
  const l21=e21[e21.length-1], l50=e50[e50.length-1], l200=e200[e200.length-1];
  const p21=e21[e21.length-2], p50=e50[e50.length-2];

  let direction,strength;
  if(l21>l50&&l50>l200&&lc>l21){direction='bullish';strength='strong';}
  else if(l21>l50&&lc>l50){direction='bullish';strength='moderate';}
  else if(l21<l50&&l50<l200&&lc<l21){direction='bearish';strength='strong';}
  else if(l21<l50&&lc<l50){direction='bearish';strength='moderate';}
  else {direction='sideways';strength='weak';}

  let crossover='none';
  if(p21<=p50&&l21>l50) crossover='bullish_cross';
  else if(p21>=p50&&l21<l50) crossover='bearish_cross';

  const slope=(l21-e21[e21.length-5])/Math.max(e21[e21.length-5],1e-10)*100;

  return {direction,strength,ema21:l21,ema50:l50,ema200:l200,crossover,slope_pct:slope};
}

function detectStructure(candles) {
  const last30=candles.slice(-30);
  const highs=last30.map(c=>c.high), lows=last30.map(c=>c.low);
  const mid=Math.floor(last30.length/2);
  const hh=Math.max(...highs.slice(mid))>Math.max(...highs.slice(0,mid));
  const hl=Math.min(...lows.slice(mid))>Math.min(...lows.slice(0,mid));
  const ll=Math.min(...lows.slice(mid))<Math.min(...lows.slice(0,mid));
  const lh=Math.max(...highs.slice(mid))<Math.max(...highs.slice(0,mid));
  return {structure:hh&&hl?'uptrend':ll&&lh?'downtrend':'ranging',hh,hl};
}

// ── Strategies (порт з Python) ────────────────────────────────────────

function s1LevelBounce(candles,levels,trend,adx){
  const close=candles[candles.length-1].close;
  const {nearest_support:ns,nearest_resistance:nr}=levels;
  const pats=detectPatterns(candles);
  let score=0,signals=[],direction='NEUTRAL';

  const atSup=ns&&Math.abs(close-ns)/close<0.012;
  const atRes=nr&&Math.abs(close-nr)/close<0.012;

  if(atSup){
    score+=25; signals.push(`✅ Ціна біля підтримки ${pf(ns)}`); direction='BUY';
    const st=levels.support_strength;
    if(st>=4){score+=20;signals.push(`✅ Дуже сильний рівень (${st} дотиків)`);}
    else if(st>=2){score+=10;signals.push(`✅ Підтверджений рівень (${st} дотики)`);}
    if(pats.includes('bullish_pinbar')||pats.includes('hammer')){score+=35;signals.push('✅ Бичачий пін-бар / молот');}
    if(pats.includes('bullish_engulfing')){score+=30;signals.push('✅ Бичаче поглинання');}
    if(pats.includes('morning_star')||pats.includes('three_white')){score+=25;signals.push('✅ Сильний розворотний паттерн');}
    if(pats.includes('tweezer_bottom')){score+=20;signals.push('✅ Пінцет знизу');}
    if(adx.adx<20){score+=10;signals.push('✅ ADX низький — відбій ймовірний');}
  } else if(atRes){
    score+=25; signals.push(`✅ Ціна біля опору ${pf(nr)}`); direction='SELL';
    const st=levels.resistance_strength;
    if(st>=4){score+=20;signals.push(`✅ Дуже сильний рівень (${st} дотиків)`);}
    else if(st>=2){score+=10;signals.push(`✅ Підтверджений рівень (${st} дотики)`);}
    if(pats.includes('bearish_pinbar')||pats.includes('shooting_star')){score+=35;signals.push('✅ Ведмежий пін-бар / зірка');}
    if(pats.includes('bearish_engulfing')){score+=30;signals.push('✅ Ведмеже поглинання');}
    if(pats.includes('evening_star')||pats.includes('three_black')){score+=25;signals.push('✅ Сильний розворотний паттерн');}
    if(pats.includes('tweezer_top')){score+=20;signals.push('✅ Пінцет зверху');}
    if(adx.adx<20){score+=10;signals.push('✅ ADX низький — відбій ймовірний');}
  }

  if(trend.direction==='bullish'&&direction==='BUY'){score+=15;signals.push('✅ Тренд підтверджує лонг');}
  else if(trend.direction==='bearish'&&direction==='SELL'){score+=15;signals.push('✅ Тренд підтверджує шорт');}
  else if(direction!=='NEUTRAL'){score-=10;signals.push('⚠️ Торгівля проти тренду');}

  return {name:'Відбій від рівня',score:Math.min(Math.max(score,0),100),direction,signals};
}

function s2Breakout(candles,levels,trend,adx){
  const close=candles[candles.length-1].close;
  const prev=candles[candles.length-2].close;
  const {nearest_support:ns,nearest_resistance:nr}=levels;
  const vols=candles.map(c=>c.volume);
  let score=0,signals=[],direction='NEUTRAL';

  if(nr&&prev<nr&&close>nr){
    score+=40;signals.push('✅ Пробій рівня опору (закриття вище)');direction='BUY';
    if((close-nr)/nr*100<0.3){score+=25;signals.push('✅ Ретест рівня');}
    if(adx.adx>20){score+=15;signals.push(`✅ ADX ${adx.adx.toFixed(0)} — тренд набирає силу`);}
  } else if(ns&&prev>ns&&close<ns){
    score+=40;signals.push('✅ Пробій рівня підтримки (закриття нижче)');direction='SELL';
    if((ns-close)/ns*100<0.3){score+=25;signals.push('✅ Ретест рівня');}
    if(adx.adx>20){score+=15;signals.push(`✅ ADX ${adx.adx.toFixed(0)} — тренд набирає силу`);}
  }

  if(direction!=='NEUTRAL'&&vols.length>=10){
    const avgVol=vols.slice(-10,-1).reduce((a,b)=>a+b,0)/9;
    const lastVol=vols[vols.length-1];
    if(avgVol>0&&lastVol>avgVol*1.3){score+=20;signals.push(`✅ Обсяг вищий за середній на ${((lastVol/avgVol-1)*100).toFixed(0)}%`);}
  }

  if(trend.direction==='bullish'&&direction==='BUY') score+=10;
  else if(trend.direction==='bearish'&&direction==='SELL') score+=10;

  return {name:'Пробій + ретест',score:Math.min(Math.max(score,0),100),direction,signals};
}

function s3TrendPullback(candles,trend,adx){
  const close=candles[candles.length-1].close;
  const {ema21,ema50}=trend;
  const pats=detectPatterns(candles);
  let score=0,signals=[],direction='NEUTRAL';

  if(adx.adx<15) return {name:'Тренд + корекція',score:0,direction:'NEUTRAL',signals:[`❌ ADX ${adx.adx.toFixed(0)} — тренд занадто слабкий`]};

  const bullPats=['bullish_pinbar','bullish_engulfing','hammer','morning_star','tweezer_bottom','three_white'];
  const bearPats=['bearish_pinbar','bearish_engulfing','shooting_star','evening_star','tweezer_top','three_black'];

  if(trend.direction==='bullish'&&['strong','moderate'].includes(trend.strength)){
    score+=25;signals.push(`✅ Висхідний тренд (ADX ${adx.adx.toFixed(0)})`);direction='BUY';
    if(trend.slope_pct>0.1){score+=10;signals.push(`✅ EMA 21 нахилена вгору`);}
    const d21=Math.abs(close-ema21)/close*100;
    const d50=Math.abs(close-ema50)/close*100;
    if(d21<0.8){score+=35;signals.push('✅ Корекція до EMA 21 — ідеальна зона');}
    else if(d21<1.5){score+=20;signals.push('✅ Корекція до EMA 21');}
    else if(d50<1.2){score+=15;signals.push('✅ Корекція до EMA 50');}
    if(bullPats.some(p=>pats.includes(p))){score+=25;signals.push('✅ Паттерн підтверджує відновлення');}
  } else if(trend.direction==='bearish'&&['strong','moderate'].includes(trend.strength)){
    score+=25;signals.push(`✅ Низхідний тренд (ADX ${adx.adx.toFixed(0)})`);direction='SELL';
    if(trend.slope_pct<-0.1){score+=10;signals.push('✅ EMA 21 нахилена вниз');}
    const d21=Math.abs(close-ema21)/close*100;
    const d50=Math.abs(close-ema50)/close*100;
    if(d21<0.8){score+=35;signals.push('✅ Корекція до EMA 21 — зона продажу');}
    else if(d21<1.5){score+=20;signals.push('✅ Корекція до EMA 21');}
    else if(d50<1.2){score+=15;signals.push('✅ Корекція до EMA 50');}
    if(bearPats.some(p=>pats.includes(p))){score+=25;signals.push('✅ Паттерн підтверджує продовження');}
  }

  return {name:'Тренд + корекція',score:Math.min(Math.max(score,0),100),direction,signals};
}

function s4Range(candles,levels,structure,adx){
  const close=candles[candles.length-1].close;
  const {nearest_support:ns,nearest_resistance:nr}=levels;
  const pats=detectPatterns(candles);
  let score=0,signals=[],direction='NEUTRAL';

  const isFlat=structure.structure==='ranging'||adx.adx<20;
  if(!isFlat) return {name:'Діапазон (флет)',score:0,direction:'NEUTRAL',signals:[`❌ ADX ${adx.adx.toFixed(0)} — ринок у тренді`]};
  if(!ns||!nr) return {name:'Діапазон (флет)',score:0,direction:'NEUTRAL',signals:['❌ Рівні не визначено']};

  const rngSz=(nr-ns)/ns;
  if(rngSz<0.005) return {name:'Діапазон (флет)',score:0,direction:'NEUTRAL',signals:['❌ Діапазон занадто вузький']};

  score+=30;signals.push(`✅ Флет підтверджено (ADX ${adx.adx.toFixed(0)})`);
  const pos=(close-ns)/(nr-ns);

  if(pos<0.2){
    score+=40;signals.push('✅ Ціна біля нижньої межі → BUY');direction='BUY';
    if(['bullish_pinbar','hammer','bullish_engulfing','morning_star','tweezer_bottom'].some(p=>pats.includes(p))){
      score+=25;signals.push('✅ Бичачий паттерн підтверджує розворот');}
  } else if(pos>0.8){
    score+=40;signals.push('✅ Ціна біля верхньої межі → SELL');direction='SELL';
    if(['bearish_pinbar','shooting_star','bearish_engulfing','evening_star','tweezer_top'].some(p=>pats.includes(p))){
      score+=25;signals.push('✅ Ведмежий паттерн підтверджує розворот');}
  } else {
    signals.push(`ℹ️ Ціна в середині діапазону (${(pos*100).toFixed(0)}%) — очікуйте меж`);
  }

  return {name:'Діапазон (флет)',score:Math.min(Math.max(score,0),100),direction,signals};
}

function s5EMACross(candles,trend,adx){
  const closes=candles.map(c=>c.close);
  const pats=detectPatterns(candles);
  const {hist}=calcMACD(closes);
  const lastHist=hist[hist.length-1], prevHist=hist[hist.length-2];
  let score=0,signals=[],direction='NEUTRAL';

  if(trend.crossover==='bullish_cross'){score+=50;signals.push('✅ Бичачий перетин EMA 21×EMA 50');direction='BUY';}
  else if(trend.crossover==='bearish_cross'){score+=50;signals.push('✅ Ведмежий перетин EMA 21×EMA 50');direction='SELL';}
  else {
    if(trend.ema21>trend.ema50){score+=20;signals.push('ℹ️ EMA 21 > EMA 50 (бичача)');direction='BUY';}
    else if(trend.ema21<trend.ema50){score+=20;signals.push('ℹ️ EMA 21 < EMA 50 (ведмежа)');direction='SELL';}
  }

  if(direction!=='NEUTRAL'){
    if(direction==='BUY'&&lastHist>0){
      score+=15;signals.push('✅ MACD бичачий');
      if(prevHist<0&&lastHist>0){score+=10;signals.push('✅ MACD перетнув нуль вгору');}
    } else if(direction==='SELL'&&lastHist<0){
      score+=15;signals.push('✅ MACD ведмежий');
      if(prevHist>0&&lastHist<0){score+=10;signals.push('✅ MACD перетнув нуль вниз');}
    }
    if(adx.adx>25){score+=10;signals.push(`✅ ADX ${adx.adx.toFixed(0)} — сильний тренд`);}
    const bullPats=['bullish_pinbar','bullish_engulfing','hammer','morning_star'];
    const bearPats=['bearish_pinbar','bearish_engulfing','shooting_star','evening_star'];
    if(direction==='BUY'&&bullPats.some(p=>pats.includes(p))){score+=20;signals.push('✅ Бичачий паттерн підтверджує');}
    else if(direction==='SELL'&&bearPats.some(p=>pats.includes(p))){score+=20;signals.push('✅ Ведмежий паттерн підтверджує');}
  }

  return {name:'EMA Crossover + MACD',score:Math.min(Math.max(score,0),100),direction,signals};
}

// ── Main Analyze (повний аналіз — однаковий з Python) ────────────────

async function analyze(sym, tf, strategy='all') {
  const candles = await fetchOHLCV(sym, tf, 100);
  if(candles.length < 30) throw new Error(`Недостатньо даних для ${sym} на ${tf}`);

  const ctxTf = CTX_TF[tf] || '1d';
  let ctxCandles = candles;
  try { ctxCandles = await fetchOHLCV(sym, ctxTf, 60); } catch(e){}

  const closes  = candles.map(c=>c.close);
  const rsiArr  = calcRSI(closes,14);
  const atrArr  = calcATR(candles,14);
  const {hist}  = calcMACD(closes);
  const adxData = calcADX(candles,14);
  const trend   = detectTrend(candles);
  const ctxTrend= detectTrend(ctxCandles);
  const levels  = findLevels(candles);
  const struct  = detectStructure(candles);
  const pats    = detectPatterns(candles);
  const lastClose=closes[closes.length-1];
  const lastRSI  =rsiArr[rsiArr.length-1]||50;
  const lastATR  =atrArr[atrArr.length-1]||lastClose*0.002;
  const lastHist =hist[hist.length-1]||0;

  const allStrats = {
    s1:s1LevelBounce(candles,levels,trend,adxData),
    s2:s2Breakout(candles,levels,trend,adxData),
    s3:s3TrendPullback(candles,trend,adxData),
    s4:s4Range(candles,levels,struct,adxData),
    s5:s5EMACross(candles,trend,adxData),
  };
  const strats = strategy==='all'?allStrats:{[strategy]:allStrats[strategy]};
  const best = Object.values(strats).reduce((a,b)=>b.score>a.score?b:a);

  const WEIGHTS={s1:1.2,s2:1.1,s3:1.3,s4:0.9,s5:1.0};
  let buyS=0,sellS=0;
  for(const [k,s] of Object.entries(allStrats)){
    const w=WEIGHTS[k]||1;
    if(s.direction==='BUY') buyS+=s.score*w;
    else if(s.direction==='SELL') sellS+=s.score*w;
  }
  const total=buyS+sellS;
  let direction='NEUTRAL', confidence=0;
  if(total>=1){
    if(buyS>sellS){direction='BUY';confidence=Math.round(Math.min(buyS/total*100,100));}
    else {direction='SELL';confidence=Math.round(Math.min(sellS/total*100,100));}
  }

  // Adjustments (порт з Python)
  if(lastRSI<30&&direction==='BUY') confidence=Math.min(confidence+8,100);
  else if(lastRSI>70&&direction==='SELL') confidence=Math.min(confidence+8,100);
  if(adxData.adx>30&&direction!=='NEUTRAL') confidence=Math.min(confidence+7,100);
  else if(adxData.adx<15) confidence=Math.max(confidence-5,0);
  if(direction==='BUY'&&lastHist>0) confidence=Math.min(confidence+5,100);
  else if(direction==='SELL'&&lastHist<0) confidence=Math.min(confidence+5,100);
  if(direction!=='NEUTRAL'&&ctxTrend.direction!==trend.direction&&ctxTrend.direction!=='sideways')
    confidence=Math.max(confidence-20,0);

  // SL / TP
  const slDist=lastATR*1.5;
  let sl,tp1,tp2;
  if(direction==='BUY'){
    sl=levels.nearest_support?Math.min(levels.nearest_support-lastATR*0.3,lastClose-slDist):lastClose-slDist;
    tp1=lastClose+Math.abs(lastClose-sl)*2.0;
    tp2=lastClose+Math.abs(lastClose-sl)*3.0;
    if(levels.nearest_resistance) tp1=Math.min(tp1,levels.nearest_resistance*0.999);
  } else if(direction==='SELL'){
    sl=levels.nearest_resistance?Math.max(levels.nearest_resistance+lastATR*0.3,lastClose+slDist):lastClose+slDist;
    tp1=lastClose-Math.abs(sl-lastClose)*2.0;
    tp2=lastClose-Math.abs(sl-lastClose)*3.0;
    if(levels.nearest_support) tp1=Math.max(tp1,levels.nearest_support*1.001);
  } else { sl=tp1=tp2=lastClose; }

  const rr=sl!==lastClose?Math.abs(tp1-lastClose)/Math.abs(sl-lastClose):0;
  if(rr<1.5&&direction!=='NEUTRAL') confidence=Math.max(confidence-15,0);

  return {
    symbol:sym, tf, context_tf:ctxTf,
    price:lastClose, direction, confidence,
    best_strategy:best, all_strategies:allStrats,
    trend, ctx_trend:ctxTrend, levels, structure:struct,
    adx:adxData, rsi:lastRSI, macd_hist:lastHist,
    atr:lastATR, sl, tp1, tp2, rr,
    candle_patterns:pats, candles,
    timestamp:new Date(),
  };
}

function pf(price,sym=''){
  if(!price||isNaN(price)) return 'N/A';
  if(sym.includes('BTC')||price>1000) return price.toLocaleString('uk',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(price>10) return price.toFixed(4);
  return price.toFixed(5);
}
function bar(val,w=10){const f=Math.min(Math.round(val/100*w),w);return '█'.repeat(f)+'░'.repeat(w-f);}

    grid:{vertLines:{color:'#1e3a5f'},horzLines:{color:'#1e3a5f'}},

  const cs=chart.addCandlestickSeries({
    upColor:'#22c55e',downColor:'#ef4444',

    wickUpColor:'#22c55e',wickDownColor:'#ef4444',

    e21s.setData(candles.map((c,i)=>({time:c.time,value:calcEMA(closes.slice(0,i+1),21).pop()})));
    e50s.setData(candles.map((c,i)=>({time:c.time,value:calcEMA(closes.slice(0,i+1),50).pop()})));
    chart.timeScale().fitContent();

        <div class="level-item"><div class="level-label">📍 Ціна</div><div class="level-value accent">${pf(r.price,sym)}</div></div>
        <div class="level-item"><div class="level-label">🛑 Stop Loss</div><div class="level-value red">${pf(r.sl,sym)}</div></div>
        <div class="level-item"><div class="level-label">🎯 TP1 (RR 1:${r.rr?.toFixed(1)})</div><div class="level-value green">${pf(r.tp1,sym)}</div></div>
        <div class="level-item"><div class="level-label">🎯 TP2 (RR 1:3.0)</div><div class="level-value green">${pf(r.tp2,sym)}</div></div>
        <div class="level-item"><div class="level-label">🟢 Підтримка</div><div class="level-value green">${pf(ns,sym)}</div></div>
        <div class="level-item"><div class="level-label">🔴 Опір</div><div class="level-value red">${pf(nr,sym)}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title mb-4">📊 Індикатори</div>
      <div class="ind-row"><div class="ind-name">📈 Тренд (${r.tf?.toUpperCase()})</div><div class="ind-badge badge-${trendDir==='bullish'?'bull':trendDir==='bearish'?'bear':'neut'}">${trendDir==='bullish'?'📈 Висхідний':trendDir==='bearish'?'📉 Низхідний':'➡️ Флет'} · ${r.trend?.strength||''}</div></div>
      <div class="ind-row"><div class="ind-name">🗺 Контекст (${r.context_tf?.toUpperCase()})</div><div class="ind-badge badge-${ctxDir==='bullish'?'bull':ctxDir==='bearish'?'bear':'neut'}">${ctxDir==='bullish'?'📈 Висхідний':ctxDir==='bearish'?'📉 Низхідний':'➡️ Флет'}</div></div>
      <div class="ind-row"><div class="ind-name">📊 ADX</div><div class="ind-value">${adxVal.toFixed(0)} — ${adxVal>=25?'✅ Сильний тренд':'➡️ Флет/слабкий'}</div></div>
      <div class="ind-row"><div class="ind-name">${rsiIcon} RSI (${rsi.toFixed(0)})</div><div class="ind-badge badge-${rsi>70?'bear':rsi<30?'bull':'neut'}">${rsi>70?'Перекуплено':rsi<30?'Перепродано':'Нейтрально'}</div></div>
      <div class="ind-row"><div class="ind-name">${macdBull?'🟢':'🔴'} MACD</div><div class="ind-badge badge-${macdBull?'bull':'bear'}">${macdBull?'Бичачий ↑':'Ведмежий ↓'}</div></div>
      <div class="ind-row"><div class="ind-name">🏗 Структура</div><div class="ind-value">${r.structure?.structure==='uptrend'?'📈 HH+HL':r.structure?.structure==='downtrend'?'📉 LH+LL':'➡️ Діапазон'}</div></div>
      ${fibHtml}
      ${pats?`<div style="margin-top:8px"><div class="small text-muted" style="margin-bottom:6px">Свічкові паттерни:</div><div class="patterns-wrap">${pats}</div></div>`:'<div class="small text-muted" style="margin-top:8px">Паттерни: не виявлено</div>'}
    </div>

    <div class="card">
      <div class="card-title mb-4">🏆 Рейтинг стратегій</div>
      ${strats}
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div class="small text-muted">🥇 Краща: <b style="color:var(--text)">${r.best_strategy?.name}</b> · ${r.best_strategy?.score}%</div>
      </div>
    </div>

    ${warns.length?`<div class="card" style="border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.05)">
      <div style="color:var(--yellow);font-weight:700;margin-bottom:6px">⚠️ Попередження</div>
      ${warns.map(w=>`<div class="small" style="color:var(--yellow);margin-top:4px">${w}</div>`).join('')}
    </div>`:''}

    ${r.best_strategy?.signals?.length?`<div class="card">
      <div class="card-title mb-4">📋 Сигнали найкращої стратегії</div>
      ${r.best_strategy.signals.slice(0,5).map(s=>`<div class="small" style="padding:3px 0;color:var(--text2)">${s}</div>`).join('')}
    </div>`:''}
  `;
}

// ── Scan with REAL data ───────────────────────────────────────────────

const SCAN_PAIRS = {
  forex:[{sym:'EURUSD=X',label:'EUR/USD'},{sym:'GBPUSD=X',label:'GBP/USD'},{sym:'USDJPY=X',label:'USD/JPY'},{sym:'AUDUSD=X',label:'AUD/USD'},{sym:'USDCHF=X',label:'USD/CHF'},{sym:'USDCAD=X',label:'USD/CAD'}],
  crypto:[{sym:'BTC-USD',label:'BTC/USD'},{sym:'ETH-USD',label:'ETH/USD'},{sym:'BNB-USD',label:'BNB/USD'},{sym:'SOL-USD',label:'SOL/USD'}],
  all:[{sym:'EURUSD=X',label:'EUR/USD'},{sym:'GBPUSD=X',label:'GBP/USD'},{sym:'BTC-USD',label:'BTC/USD'},{sym:'ETH-USD',label:'ETH/USD'},{sym:'GC=F',label:'Золото'},{sym:'^GSPC',label:'S&P 500'}],
};

function setScanCat(cat){
  state.scanCat=cat;
  document.querySelectorAll('#page-scan .cat-tab').forEach((b,i)=>b.classList.toggle('active',['forex','crypto','all'][i]===cat));
}

async function runScan(){
  const pairs=SCAN_PAIRS[state.scanCat]||SCAN_PAIRS.forex;
  const el=document.getElementById('scanResults');
  el.innerHTML=`<div class="loader"><div class="spinner"></div><div class="loader-text">Аналізую ${pairs.length} пар з реальними даними...</div></div>`;

  const results=[];
  for(const p of pairs){
    try{
      const r=await analyze(p.sym,'1h','all');
      results.push({sym:p.sym,label:p.label,direction:r.direction,confidence:r.confidence,
        strategy:r.best_strategy?.name||'—',rsi:r.rsi?.toFixed(0)||'—',
        adx:(r.adx?.adx||0).toFixed(0),rr:r.rr?.toFixed(1)||'—',patterns:r.candle_patterns||[]});
    } catch(e){
      results.push({sym:p.sym,label:p.label,direction:'ERROR',confidence:0,strategy:'—',rsi:'—',adx:'—',rr:'—',patterns:[]});
    }
    // Показуємо прогрес
    const done=results.length;
    el.innerHTML=`<div class="loader"><div class="spinner"></div><div class="loader-text">Проаналізовано ${done}/${pairs.length}: ${p.label}</div><div style="width:200px;height:4px;background:var(--border);border-radius:2px;margin-top:8px"><div style="width:${done/pairs.length*100}%;height:100%;background:var(--accent);border-radius:2px;transition:.3s"></div></div></div>`;
  }

  results.sort((a,b)=>(b.direction!=='NEUTRAL'&&b.direction!=='ERROR'?b.confidence:-999)-(a.direction!=='NEUTRAL'&&a.direction!=='ERROR'?a.confidence:-999));

  const html=results.map(r=>{
    const dCls=(r.direction||'neutral').toLowerCase();
    const icon=r.direction==='BUY'?'↑':r.direction==='SELL'?'↓':'—';
    const pats=r.patterns.slice(0,2).map(p=>PAT_LABELS[p]||p).join(', ')||'—';
    return `<div class="scan-item" onclick="selectPair('${r.sym}','${r.label}');showPage('analysis');runAnalysis()">
      <div class="scan-signal ${dCls}">${icon}</div>
      <div style="flex:1">
        <div class="scan-name">${r.label}</div>
        <div class="scan-detail">${r.strategy} · RSI ${r.rsi} · ADX ${r.adx} · RR 1:${r.rr}</div>
        <div class="scan-detail" style="margin-top:2px">${pats}</div>
      </div>
      <div class="scan-conf ${dCls}">${r.confidence}%<br><span style="font-size:10px;font-weight:400">${r.direction}</span></div>
    </div>`;
  }).join('');

  el.innerHTML=html||'<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Немає сигналів</div></div>';
  showToast(`✅ Скан завершено: ${results.filter(r=>r.direction==='BUY').length} BUY, ${results.filter(r=>r.direction==='SELL').length} SELL`);
}

// ── Risk Calculator ───────────────────────────────────────────────────

function calcRisk(){
  const dep=+document.getElementById('calcDeposit').value||50;
  const riskP=+document.getElementById('calcRisk').value||2;
  const entry=+document.getElementById('calcEntry').value||0;
  const sl=+document.getElementById('calcSL').value||0;
  const tp=+document.getElementById('calcTP').value||0;
  const pipV=+document.getElementById('calcPipVal').value||0.1;
  const riskUSD=dep*riskP/100;
  document.getElementById('rRisk').textContent='$'+riskUSD.toFixed(2);
  document.getElementById('rMaxLoss').textContent='$'+(dep*0.05).toFixed(2);
  if(entry&&sl&&Math.abs(sl-entry)>0){
    const slPips=Math.abs(entry-sl)*10000;
    const tpPips=tp?Math.abs(tp-entry)*10000:0;
    const lot=riskUSD/(slPips*pipV);
    const rr=tpPips/slPips;
    const profit=tpPips*pipV*lot;
    document.getElementById('rLot').textContent=lot.toFixed(2)+' лот';
    document.getElementById('rSLPips').textContent=slPips.toFixed(1)+' пп';
    document.getElementById('rTPPips').textContent=tpPips?tpPips.toFixed(1)+' пп':'—';
    document.getElementById('rRR').textContent=rr?'1:'+rr.toFixed(2):'—';
    document.getElementById('rProfit').textContent=profit?'$'+profit.toFixed(2):'—';
  }
}

function buildRiskTable(){
  const dep=+document.getElementById('calcDeposit').value||50;
  const rows=[[1],[2],[5],[10],[25],[50]].map(([rp])=>`
    <div class="ind-row">
      <div class="ind-name">Ризик ${rp}%</div>
      <div class="ind-value"><span class="text-red">-$${(dep*rp/100).toFixed(2)}</span> / <span class="text-green">макс $${(dep*0.05).toFixed(2)}/день</span></div>
    </div>`).join('');
  document.getElementById('riskTable').innerHTML=`
    <div class="ind-row"><div class="ind-name bold">Депозит: $${dep}</div><div class="ind-value bold text-green">Ризик → Втрата</div></div>${rows}`;
}

// ── Journal ───────────────────────────────────────────────────────────

function addJournalEntry(){
  const pair=document.getElementById('jPair').value.trim();
  const dir=document.getElementById('jDir').value;
  const result=parseFloat(document.getElementById('jResult').value);
  const rr=parseFloat(document.getElementById('jRR').value)||0;
  const strat=document.getElementById('jStrat').value;
  const note=document.getElementById('jNote').value.trim();
  if(!pair||isNaN(result)){showToast('⚠️ Заповніть пару та результат');return;}
  state.journal.unshift({id:Date.now(),date:new Date().toLocaleDateString('uk'),pair,dir,result,rr,strat,note});
  localStorage.setItem('tradeJournal',JSON.stringify(state.journal));
  ['jPair','jResult','jRR','jNote'].forEach(id=>document.getElementById(id).value='');
  renderJournal(); showToast('✅ Угоду збережено');
}

function clearJournal(){
  if(confirm('Очистити весь журнал?')){state.journal=[];localStorage.setItem('tradeJournal','[]');renderJournal();}
}

function renderJournal(){
  const j=state.journal;
  const wins=j.filter(e=>e.result>0).length;
  const pl=j.reduce((s,e)=>s+e.result,0);
  const avgRR=j.length?(j.reduce((s,e)=>s+e.rr,0)/j.length).toFixed(2):0;
  document.getElementById('statWR').textContent=j.length?Math.round(wins/j.length*100)+'%':'0%';
  document.getElementById('statTrades').textContent=j.length;
  document.getElementById('statPL').textContent=(pl>=0?'+':'')+pl.toFixed(2)+'$';
  document.getElementById('statPL').className='stat-value '+(pl>=0?'text-green':'text-red');
  document.getElementById('statAvgRR').textContent='1:'+avgRR;
  document.getElementById('journalEntries').innerHTML=!j.length
    ?'<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">Журнал порожній</div></div>'
    :j.slice(0,20).map(e=>`<div class="entry-item">
      <div class="entry-header"><div class="entry-pair">${e.dir==='BUY'?'🟢':'🔴'} ${e.pair}</div><div class="entry-result ${e.result>=0?'win':'loss'}">${e.result>=0?'+':''}${e.result.toFixed(2)}$</div></div>
      <div class="entry-details"><span>📅 ${e.date}</span><span>⚖️ RR 1:${e.rr}</span><span>📊 ${e.strat}</span></div>
      ${e.note?`<div class="entry-note">💬 ${e.note}</div>`:''}
    </div>`).join('');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── Init ──────────────────────────────────────────────────────────────

renderPairs();
loadChart();  // Реальний графік з API
calcRisk();
buildRiskTable();
renderJournal();
if(tg) tg.BackButton.onClick(()=>{showPage('analysis');tg.BackButton.hide();});
</script>
